name: Deploy Portfolio to GitHub Pages

on:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: github-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    permissions:
      contents: read
      pages: read
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1

      - name: Set up .NET
        uses: actions/setup-dotnet@v6.1.0
        with:
          dotnet-version: 10.x

      - name: Test portfolio
        run: dotnet test portfolio.sln --configuration Release

      - name: Publish Blazor WebAssembly app
        run: dotnet publish ./portfolio.Client/portfolio.Client.csproj --configuration Release --output ./build --nologo

      - name: Add 404 fallback for client-side routes
        run: cp ./build/wwwroot/index.html ./build/wwwroot/404.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6.0.0

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: ./build/wwwroot

  deploy:
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
